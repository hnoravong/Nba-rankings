<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Custom Rankings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        h1 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
        }

        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0ea5e9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            background: #1e293b;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th {
            background: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>NBA Custom Player Rankings</h1>
            <p>Enter how much you value each stat, then generate rankings.</p>

            <form method="POST">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="points_per_game">Points Per Game</label>
                        <input type="number" name="points_per_game" value="{{ weights.points_per_game }}">
                    </div>

                    <div class="input-group">
                        <label for="assists_per_game">Assists Per Game</label>
                        <input type="number" name="assists_per_game" value="{{ weights.assists_per_game }}">
                    </div>

                    <div class="input-group">
                        <label for="rebounds_per_game">Rebounds Per Game</label>
                        <input type="number" name="rebounds_per_game" value="{{ weights.rebounds_per_game }}">
                    </div>

                    <div class="input-group">
                        <label for="games_played">Games Played</label>
                        <input type="number" name="games_played" value="{{ weights.games_played }}">
                    </div>

                    <div class="input-group">
                        <label for="fg_pct">Field Goal %</label>
                        <input type="number" step="0.1" name="fg_pct" value="{{ weights.fg_pct }}">
                    </div>

                    <div class="input-group">
                        <label for="turnovers_per_game">Turnovers Per Game</label>
                        <input type="number" name="turnovers_per_game" value="{{ weights.turnovers_per_game }}">
                    </div>
                </div>

                <button type="submit">Generate Rankings</button>
            </form>

            {% if rankings %}
                <table>
                    <thead>
                        <tr>
                            {% for key in rankings[0].keys() %}
                                <th>{{ key }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for player in rankings %}
                            <tr>
                                {% for value in player.values() %}
                                    <td>{{ value }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% endif %}
        </div>
    </div>
</body>
</html>
